{% extends "base.html" %}

{% block title %}Delete Subscription - Subly{% endblock %}

{% block content %}
<div>
    <div>
        <div>
            <svg width="64" height="64" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                </path>
            </svg>
        </div>
        <h2>Delete Subscription</h2>
        <p>Are you sure you want to delete <strong>{{ subscription.service_name }}</strong>? This action cannot be
            undone.</p>

        <form method="post">
            {% csrf_token %}
            <a href="{% url 'subscriptions:list' %}">Cancel</a>
            <button type="submit">
                Confirm Delete
            </button>
        </form>
    </div>
</div>
{% endblock %}
