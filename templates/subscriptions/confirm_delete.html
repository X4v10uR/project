{% extends "base.html" %}

{% block title %}Delete Subscription - Subly{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center py-12">
    <div class="bg-white p-8 rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100">
        <div class="w-16 h-16 bg-red-50 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                </path>
            </svg>
        </div>
        <h2 class="text-xl font-bold text-gray-900 mb-2">Delete Subscription</h2>
        <p class="text-gray-500 mb-8">Are you sure you want to delete <span class="font-semibold text-gray-900">{{ subscription.service_name }}</span>? This action cannot be undone.</p>

        <form method="post" class="space-x-4">
            {% csrf_token %}
            <a href="{% url 'subscriptions:list' %}"
                class="px-6 py-2 text-gray-500 hover:text-gray-700 font-medium transition">Cancel</a>
            <button type="submit"
                class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition font-medium shadow-sm">
                Confirm Delete
            </button>
        </form>
    </div>
</div>
{% endblock %}
