<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Subscription Card - Premium Layout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <!-- Card Container with subtle gradient and shadow -->
  <div class="bg-gradient-to-br from-[#e6ed0e] to-[#e6ed0e] rounded-[28px] w-[220px] h-[20px] p-6 flex flex-col justify-between shadow-xl shadow-[#7ac4b4]/30 border border-white/20 transition-transform hover:scale-105 duration-300">
    
    <!-- Top Section: Logo (Left) & Brand (Right) -->
    <div class="flex justify-between items-start w-full">
      <!-- Icon Container with glassmorphism effect -->
      <div class="w-[52px] h-[52px] rounded-full bg-white/25 border border-white/40 flex items-center justify-center shadow-sm backdrop-blur-sm">
        <svg viewBox="0 0 24 24" class="w-7 h-7 relative">
          <!-- Dark circle behind the path to make the cutouts appear dark slate -->
          <circle cx="12" cy="12" r="11.5" fill="#1c2b36" />
          <!-- Standard Spotify Logo Path -->
          <path fill="#1ed760" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.24 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z" />
        </svg>
      </div>
      
      <!-- Brand Name -->
      <div class="text-[30px] font-bold text-[#1c2b36] mt-1 tracking-tight">
        Spotify
      </div>
    </div>

    <!-- Bottom Section: Price & Status right-aligned -->
    <div class="mt-auto flex flex-col items-end text-right">
      <!-- Emphasized Price -->
      <div class="text-[36px] font-extrabold text-[#1c2b36] leading-none tracking-tighter drop-shadow-sm">
        $9.99
      </div>
      <!-- Styled Subtitle -->
      <div class="text-[12px] font-bold text-[#3a5751] mt-2 uppercase tracking-wider bg-black/5 px-2.5 py-1 rounded-full">
        5 days left
      </div>
    </div>
    
  </div>

</body>
</html>
