<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Subscriptions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #F6F6F2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    select { appearance: none; }
    input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
    .drawer-enter { transform: translateX(0); }
    .drawer-exit  { transform: translateX(100%); }
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { transform: scale(1.025); box-shadow: 0 20px 40px rgba(0,0,0,0.18); }
    .card-hover:active { transform: scale(0.98); }
    .slide-drawer { transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
    .fade-overlay { transition: opacity 0.3s ease; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
  </style>
</head>
<body>

<div id="app" class="min-h-screen bg-[#F6F6F2]"></div>

<!-- DETAIL DRAWER OVERLAY -->
<div id="drawer-overlay" class="fixed inset-0 bg-black/40 z-40 fade-overlay opacity-0 pointer-events-none" onclick="closeDrawer()"></div>
<!-- DETAIL DRAWER -->
<div id="detail-drawer" class="slide-drawer fixed top-0 right-0 h-full w-full max-w-[420px] bg-white z-50 shadow-2xl flex flex-col translate-x-full">
  <div id="drawer-content"></div>
</div>

<!-- ADD MODAL OVERLAY -->
<div id="modal-overlay" class="fixed inset-0 bg-black/40 z-50 fade-overlay opacity-0 pointer-events-none flex items-center justify-center p-4" onclick="handleModalOverlayClick(event)">
  <div id="modal-content" class="bg-white rounded-3xl w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()"></div>
</div>

<script>
// ─── DATA ──────────────────────────────────────────────────────────────────
const CDN = 'https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg';

let subscriptions = [
  { id:1, service:'Netflix', plan:'Premium', iconUrl:`${CDN}/netflix.svg`, iconLabel:'NF', brandColor:'#E50914', textOnCard:'white', billingCycle:'Monthly', sharedMembers:[{id:'s1',name:'Alice Chen',initials:'AC',color:'#FF9F43'},{id:'s2',name:'Bob Smith',initials:'BS',color:'#54A0FF'},{id:'s3',name:'Carol White',initials:'CW',color:'#5F27CD'}], account:'john.doe@gmail.com', cost:21.0, currency:'USD', isShared:true, myPortion:7.0, renewal:new Date('2026-03-25'), renewalTime:'08:30 PM', status:'Active', category:'Streaming', paymentCard:'**** 5426' },
  { id:2, service:'Spotify', plan:'Premium Family', iconUrl:`${CDN}/spotify.svg`, iconLabel:'SP', brandColor:'#1DB954', textOnCard:'white', billingCycle:'Monthly', sharedMembers:[], account:'john.doe@gmail.com', cost:18.0, currency:'USD', isShared:false, renewal:new Date('2026-03-22'), renewalTime:'09:30 PM', status:'Active', category:'Music', paymentCard:'**** 5426' },
  { id:3, service:'Apple TV+', plan:'Premium', iconUrl:`${CDN}/apple-tv-plus.svg`, iconLabel:'TV', brandColor:'#1C1C1E', textOnCard:'white', billingCycle:'Monthly', sharedMembers:[], account:'john@icloud.com', cost:12.0, currency:'USD', isShared:false, renewal:new Date('2026-04-12'), renewalTime:'04:00 PM', status:'Active', category:'Streaming', paymentCard:'**** 5426' },
  { id:4, service:'Creative Cloud', plan:'All Apps', iconUrl:`${CDN}/adobe-creative-cloud.svg`, iconLabel:'CC', brandColor:'#DA1F26', textOnCard:'white', billingCycle:'Monthly', sharedMembers:[], account:'john.doe@adobe.com', cost:54.2, currency:'USD', isShared:false, renewal:new Date('2026-04-01'), renewalTime:'10:00 AM', status:'Active', category:'Software', paymentCard:'**** 1234' },
  { id:5, service:'AWS', plan:'Developer', iconUrl:`${CDN}/amazon-web-services.svg`, iconLabel:'AWS', brandColor:'#232F3E', textOnCard:'white', billingCycle:'Monthly', sharedMembers:[{id:'s4',name:'Dev Team',initials:'DT',color:'#10AC84'}], account:'admin@company.com', cost:89.0, currency:'USD', isShared:true, myPortion:44.5, renewal:new Date('2026-03-31'), status:'Active', category:'Cloud', paymentCard:'**** 9876' },
  { id:6, service:'GitHub', plan:'Pro', iconUrl:`${CDN}/github.svg`, iconLabel:'GH', brandColor:'#24292F', textOnCard:'white', billingCycle:'Yearly', sharedMembers:[], account:'johndoe', cost:48.0, currency:'USD', isShared:false, renewal:new Date('2027-01-15'), status:'Active', category:'Software', paymentCard:'**** 5426' },
  { id:7, service:'Notion', plan:'Personal Pro', iconUrl:`${CDN}/notion.svg`, iconLabel:'NT', brandColor:'#191919', textOnCard:'white', billingCycle:'Monthly', sharedMembers:[], account:'john.doe@gmail.com', cost:16.0, currency:'USD', isShared:false, renewal:new Date('2026-03-28'), status:'Paused', category:'Software', paymentCard:'**** 5426' },
  { id:8, service:'Gym', plan:'Premium', iconUrl:'', iconLabel:'GYM', brandColor:'#F59E0B', textOnCard:'dark', billingCycle:'Monthly', sharedMembers:[], account:null, cost:45.0, currency:'USD', isShared:false, renewal:new Date('2026-04-05'), status:'Active', category:'Fitness', paymentCard:'**** 3456' },
  { id:9, service:'Figma', plan:'Professional', iconUrl:`${CDN}/figma.svg`, iconLabel:'FG', brandColor:'#0D0D0D', textOnCard:'white', billingCycle:'Yearly', sharedMembers:[{id:'s5',name:'Sarah Lee',initials:'SL',color:'#A29BFE'},{id:'s6',name:'Mike Chen',initials:'MC',color:'#00CEC9'}], account:'john@company.com', cost:180.0, currency:'USD', isShared:true, myPortion:60.0, renewal:new Date('2026-08-20'), status:'Cancelled', category:'Software', paymentCard:'**** 1234' },
  { id:10, service:'YouTube', plan:'Premium', iconUrl:`${CDN}/youtube.svg`, iconLabel:'YT', brandColor:'#FF0000', textOnCard:'white', billingCycle:'Monthly', sharedMembers:[], account:'john.doe@gmail.com', cost:13.99, currency:'USD', isShared:false, renewal:new Date('2026-04-08'), renewalTime:'11:00 AM', status:'Active', category:'Streaming', paymentCard:'**** 5426' },
];

// ─── STATE ─────────────────────────────────────────────────────────────────
let searchQuery = '';
let statusFilter = 'All Status';
let sortBy = 'Renewal Date';
let pendingStatus = 'All Status';
let pendingSort = 'Renewal Date';
let selectedSub = null;
let showFilters = false;
let showModal = false;
let iconErrors = {};

// Modal form state
let modalForm = {
  service:'', plan:'', cost:'', currency:'USD', billingCycle:'Monthly',
  renewal:'', account:'', paymentCard:'', category:'Other', status:'Active', brandColorIndex:0
};
let modalErrors = {};

const BRAND_COLORS = ['#E50914','#1DB954','#1C1C1E','#1473E6','#232F3E','#24292F','#F59E0B','#F24E1E','#FF0000','#7C5CEB'];
const CATEGORIES = ['Streaming','Music','Software','Cloud','Fitness','Utilities','Gaming','Other'];
const BILLING_CYCLES = ['Weekly','Monthly','Yearly'];

// ─── HELPERS ───────────────────────────────────────────────────────────────
const fmtCurrency = (n, c) => new Intl.NumberFormat('en-US',{style:'currency',currency:c,minimumFractionDigits:2}).format(n);
const daysUntil = d => Math.ceil((new Date(d).getTime() - Date.now()) / 86400000);
const cycleLabel = {Monthly:'monthly',Yearly:'yearly',Weekly:'weekly'};
const categoryColors = {Streaming:'#FFE0E0',Music:'#D0F4E8',Software:'#D8E8FF',Cloud:'#FFE8CC',Fitness:'#FFF0CC',Utilities:'#D8F0CC',Gaming:'#EED8FF',Other:'#F0F0F0'};

function getStats() {
  const active = subscriptions.filter(s => s.status === 'Active');
  const monthlySpend = active.reduce((sum, s) => {
    const eff = s.isShared && s.myPortion != null ? s.myPortion : s.cost;
    const mo = s.billingCycle === 'Yearly' ? eff/12 : s.billingCycle === 'Weekly' ? eff*4.33 : eff;
    return sum + mo;
  }, 0);
  return {
    total: subscriptions.length,
    active: active.length,
    paused: subscriptions.filter(s=>s.status==='Paused').length,
    cancelled: subscriptions.filter(s=>s.status==='Cancelled').length,
    monthlySpend
  };
}

function getFiltered() {
  let list = [...subscriptions];
  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    list = list.filter(s => s.service.toLowerCase().includes(q) || (s.plan||'').toLowerCase().includes(q) || s.category.toLowerCase().includes(q));
  }
  if (statusFilter !== 'All Status') list = list.filter(s => s.status === statusFilter);
  list.sort((a, b) => {
    if (sortBy === 'Renewal Date') return new Date(a.renewal) - new Date(b.renewal);
    if (sortBy === 'Cost') { const ca=a.isShared&&a.myPortion!=null?a.myPortion:a.cost, cb=b.isShared&&b.myPortion!=null?b.myPortion:b.cost; return cb-ca; }
    if (sortBy === 'Name') return a.service.localeCompare(b.service);
    return 0;
  });
  return list;
}

const hasActiveFilters = () => statusFilter !== 'All Status' || sortBy !== 'Renewal Date' || searchQuery.trim() !== '';

// ─── ICON HTML ─────────────────────────────────────────────────────────────
function serviceIconCard(sub) {
  const fs = sub.iconLabel.length > 2 ? '10px' : '13px';
  if (sub.iconUrl && !iconErrors[sub.id]) {
    return `<div class="w-14 h-14 rounded-2xl bg-white shadow-md flex items-center justify-center overflow-hidden p-2 shrink-0">
      <img src="${sub.iconUrl}" alt="" class="w-full h-full object-contain" onerror="iconErrors[${sub.id}]=true;render()" />
    </div>`;
  }
  return `<div class="w-14 h-14 rounded-2xl bg-white shadow-md flex items-center justify-center overflow-hidden p-2 shrink-0">
    <div class="w-full h-full rounded-xl flex items-center justify-center" style="background-color:${sub.brandColor}">
      <span class="font-bold text-white leading-none" style="font-size:${fs}">${sub.iconLabel}</span>
    </div>
  </div>`;
}

function serviceIconDrawer(sub) {
  const fs = sub.iconLabel.length > 2 ? '11px' : '18px';
  if (sub.iconUrl && !iconErrors[sub.id]) {
    return `<div class="w-16 h-16 rounded-2xl flex items-center justify-center shadow-md overflow-hidden p-2.5" style="background-color:${sub.brandColor}">
      <img src="${sub.iconUrl}" alt="" class="w-full h-full object-contain" onerror="iconErrors[${sub.id}]=true;renderDrawer()" />
    </div>`;
  }
  return `<div class="w-16 h-16 rounded-2xl flex items-center justify-center shadow-md overflow-hidden p-2.5" style="background-color:${sub.brandColor}">
    <span class="font-bold text-white leading-none" style="font-size:${fs}">${sub.iconLabel}</span>
  </div>`;
}

// ─── CARD HTML ─────────────────────────────────────────────────────────────
function cardHtml(sub) {
  const isLight = sub.textOnCard === 'white';
  const mainText = isLight ? 'text-white' : 'text-[#1a1a1a]';
  const mutedText = isLight ? 'text-white/65' : 'text-[#555]';
  const dividerColor = isLight ? 'border-white/15' : 'border-black/10';
  const badgeBg = isLight ? 'bg-white/15' : 'bg-black/10';
  const badgeText = isLight ? 'text-white' : 'text-[#333]';

  const displayCost = sub.isShared && sub.myPortion != null ? sub.myPortion : sub.cost;
  const renewalDateStr = new Date(sub.renewal).toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'});
  const daysLeft = daysUntil(sub.renewal);

  const renewalUrgency = daysLeft < 0 ? (isLight ? 'text-red-300' : 'text-red-600')
    : daysLeft <= 3 ? (isLight ? 'text-yellow-300' : 'text-orange-600') : mainText;

  const statusDot = {Active:'bg-emerald-500',Paused:'bg-amber-400',Cancelled:'bg-red-400'}[sub.status];

  const urgencyBadge = daysLeft >= 0 && daysLeft <= 7
    ? `<span class="font-normal ml-1.5 ${mutedText}">(${daysLeft===0?'today':`${daysLeft}d left`})</span>` : '';

  const sharedBadge = sub.isShared
    ? `<div class="absolute top-4 right-4 inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-full ${badgeBg} ${badgeText}">
        <i data-lucide="users" class="w-2.5 h-2.5"></i>Shared
      </div>` : '';

  const membersHtml = sub.sharedMembers.length > 0
    ? `<div class="flex items-center gap-1.5">
        <div class="flex -space-x-1.5">${sub.sharedMembers.slice(0,3).map(m=>`<div class="w-5 h-5 rounded-full border-[1.5px] border-white/60 flex items-center justify-center text-[8px] font-bold text-white shrink-0" style="background-color:${m.color}" title="${m.name}">${m.initials.charAt(0)}</div>`).join('')}</div>
        <span class="text-[11px] font-medium ${mutedText}">${sub.sharedMembers.length+1} people</span>
      </div>`
    : `<span class="text-[11px] font-medium ${mutedText}">Only me</span>`;

  const portionNote = sub.isShared && sub.myPortion != null
    ? `<div class="text-[11px] mt-0.5 ${mutedText}">of ${fmtCurrency(sub.cost,sub.currency)} total</div>` : '';

  return `
    <div class="relative rounded-[28px] p-5 cursor-pointer card-hover select-none shadow-lg" style="background-color:${sub.brandColor}" onclick="openDrawer(${sub.id})">
      ${sharedBadge}
      <div class="flex items-start justify-between gap-3 mb-5">
        ${serviceIconCard(sub)}
        <div class="text-right">
          <div class="text-[22px] font-bold leading-tight tracking-tight ${mainText}">${fmtCurrency(displayCost,sub.currency)}</div>
          <div class="text-sm leading-tight ${mutedText}">${cycleLabel[sub.billingCycle]}</div>
          ${portionNote}
        </div>
      </div>
      <div class="mb-4">
        <h3 class="text-[26px] font-bold leading-tight tracking-tight ${mainText}">${sub.service}</h3>
        ${sub.plan ? `<p class="text-sm mt-0.5 ${mutedText}">${sub.plan}</p>` : ''}
      </div>
      <div class="pt-3.5 border-t ${dividerColor} mb-3">
        <p class="text-[11px] font-semibold uppercase tracking-wider mb-0.5 ${mutedText}">Renewal:</p>
        <p class="text-sm font-bold ${renewalUrgency}">${renewalDateStr}${urgencyBadge}</p>
      </div>
      <div class="flex items-center justify-between gap-2">
        ${membersHtml}
        <div class="flex items-center gap-1.5">
          ${sub.paymentCard ? `<span class="text-[10px] font-semibold px-2 py-1 rounded-full ${badgeBg} ${badgeText}">${sub.paymentCard}</span>` : ''}
          <span class="inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-1 rounded-full ${badgeBg} ${badgeText}">
            <span class="w-1.5 h-1.5 rounded-full ${statusDot}"></span>${sub.status}
          </span>
        </div>
      </div>
    </div>`;
}

// ─── DRAWER HTML ───────────────────────────────────────────────────────────
function drawerHtml(sub) {
  if (!sub) return '';
  const cfg = {
    Active: {dot:'bg-emerald-500',text:'text-emerald-700',bg:'bg-emerald-50',border:'border-emerald-200'},
    Paused: {dot:'bg-amber-500',text:'text-amber-700',bg:'bg-amber-50',border:'border-amber-200'},
    Cancelled: {dot:'bg-red-400',text:'text-red-600',bg:'bg-red-50',border:'border-red-200'},
  }[sub.status];

  const renewalDateStr = new Date(sub.renewal).toLocaleDateString('en-US',{month:'long',day:'2-digit',year:'numeric'});
  const daysLeft = daysUntil(sub.renewal);
  const daysColor = daysLeft < 0 ? 'text-red-500' : daysLeft <= 3 ? 'text-orange-500' : daysLeft <= 7 ? 'text-amber-600' : 'text-emerald-600';
  const daysLabel = daysLeft < 0 ? 'Overdue' : daysLeft === 0 ? 'Today' : daysLeft === 1 ? '1 day left' : `${daysLeft} days left`;

  const priceBlock = sub.isShared && sub.myPortion != null
    ? `<div class="flex items-end justify-between">
        <div><p class="text-xs text-white/60 mb-0.5 uppercase tracking-wide">Your share</p>
          <p class="text-3xl font-bold text-white leading-none">${fmtCurrency(sub.myPortion,sub.currency)}</p></div>
        <div class="text-right"><p class="text-xs text-white/60 mb-0.5">Total plan</p>
          <p class="text-base font-semibold text-white/80">${fmtCurrency(sub.cost,sub.currency)}</p></div>
      </div>`
    : `<div><p class="text-xs text-white/60 mb-0.5 uppercase tracking-wide">per ${sub.billingCycle.toLowerCase()}</p>
        <p class="text-3xl font-bold text-white leading-none">${fmtCurrency(sub.cost,sub.currency)}</p></div>`;

  const membersDetail = sub.sharedMembers.length === 0
    ? `<span class="text-sm font-semibold text-[#1a1a1a]">Only me</span>`
    : `<div class="flex flex-col items-end gap-1.5">
        <span class="text-sm font-semibold text-[#1a1a1a]">${sub.sharedMembers.length+1} people</span>
        ${sub.sharedMembers.map(m=>`<div class="flex items-center gap-2"><span class="text-xs text-[#666]">${m.name}</span><div class="w-5 h-5 rounded-full flex items-center justify-center text-[9px] font-bold text-white" style="background-color:${m.color}">${m.initials.charAt(0)}</div></div>`).join('')}
      </div>`;

  const costBreakdown = sub.isShared && sub.myPortion != null ? `
    <div class="border-t border-gray-100 my-0.5"></div>
    <div class="bg-[#F8F8F5] rounded-2xl p-4 space-y-2 mt-2">
      <p class="text-[11px] font-bold text-[#888] uppercase tracking-wider">Cost Breakdown</p>
      <div class="flex justify-between"><span class="text-sm text-[#555]">Total plan</span><span class="text-sm font-bold text-[#1a1a1a]">${fmtCurrency(sub.cost,sub.currency)}</span></div>
      <div class="flex justify-between"><span class="text-sm text-[#555]">Your portion</span><span class="text-sm font-bold text-emerald-600">${fmtCurrency(sub.myPortion,sub.currency)}</span></div>
      <div class="flex justify-between"><span class="text-sm text-[#555]">Split among</span><span class="text-sm font-bold text-[#1a1a1a]">${sub.sharedMembers.length+1} people</span></div>
    </div>` : '';

  const textColor = sub.textOnCard === 'white' ? '#fff' : '#1a1a1a';

  return `
    <div class="flex flex-col h-screen">
      <!-- Header -->
      <div class="px-6 pt-5 pb-6 relative overflow-hidden shrink-0" style="background-color:${sub.brandColor}">
        <button onclick="closeDrawer()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition-colors">
          <i data-lucide="x" class="w-4 h-4 text-white"></i>
        </button>
        <div class="flex items-center gap-4 mb-5">
          ${serviceIconDrawer(sub)}
          <div class="flex-1 min-w-0">
            <h2 class="text-xl font-bold text-white leading-tight">${sub.service}</h2>
            ${sub.plan ? `<p class="text-sm text-white/70 mt-0.5">${sub.plan}</p>` : ''}
            <div class="flex items-center gap-2 mt-2 flex-wrap">
              <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-white/20 text-white border border-white/25">${sub.billingCycle}</span>
              ${sub.isShared ? `<span class="inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-full bg-white/20 text-white border border-white/25"><i data-lucide="users" class="w-3 h-3"></i>Shared</span>` : ''}
            </div>
          </div>
        </div>
        <div class="bg-white/15 rounded-2xl px-4 py-3 border border-white/20">${priceBlock}</div>
      </div>

      <!-- Details -->
      <div class="flex-1 overflow-y-auto px-6 py-4 space-y-0.5">
        <!-- Status -->
        <div class="flex items-center justify-between py-3 gap-4">
          <div class="flex items-center gap-2.5 shrink-0">
            <span class="text-[#bbb]"><i data-lucide="refresh-cw" class="w-4 h-4"></i></span>
            <span class="text-sm text-[#666]">Status</span>
          </div>
          <div class="relative">
            <select onchange="changeStatus(${sub.id},this.value)" class="cursor-pointer text-sm font-semibold pl-3 pr-7 py-1.5 rounded-full border ${cfg.bg} ${cfg.text} ${cfg.border} focus:outline-none">
              <option value="Active" ${sub.status==='Active'?'selected':''}>Active</option>
              <option value="Paused" ${sub.status==='Paused'?'selected':''}>Paused</option>
              <option value="Cancelled" ${sub.status==='Cancelled'?'selected':''}>Cancelled</option>
            </select>
            <i data-lucide="chevron-down" class="w-3.5 h-3.5 pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 ${cfg.text}"></i>
          </div>
        </div>
        <div class="border-t border-gray-100 my-0.5"></div>
        <div class="flex items-center justify-between py-3 gap-4">
          <div class="flex items-center gap-2.5 shrink-0"><span class="text-[#bbb]"><i data-lucide="refresh-cw" class="w-4 h-4"></i></span><span class="text-sm text-[#666]">Billing Cycle</span></div>
          <span class="text-sm font-semibold text-[#1a1a1a]">${sub.billingCycle}</span>
        </div>
        <div class="flex items-center justify-between py-3 gap-4">
          <div class="flex items-center gap-2.5 shrink-0"><span class="text-[#bbb]"><i data-lucide="tag" class="w-4 h-4"></i></span><span class="text-sm text-[#666]">Category</span></div>
          <span class="text-sm font-semibold px-3 py-1 rounded-full" style="background-color:${categoryColors[sub.category]||'#F0F0F0'};color:#1a1a1a">${sub.category}</span>
        </div>
        <div class="border-t border-gray-100 my-0.5"></div>
        <div class="flex items-center justify-between py-3 gap-4">
          <div class="flex items-center gap-2.5 shrink-0"><span class="text-[#bbb]"><i data-lucide="calendar" class="w-4 h-4"></i></span><span class="text-sm text-[#666]">Next Renewal</span></div>
          <div class="text-right">
            <p class="text-sm font-semibold text-[#1a1a1a]">${renewalDateStr}</p>
            ${sub.renewalTime ? `<p class="text-xs text-[#888]">${sub.renewalTime}</p>` : ''}
            <p class="text-xs font-semibold mt-0.5 ${daysColor}">${daysLabel}</p>
          </div>
        </div>
        <div class="border-t border-gray-100 my-0.5"></div>
        ${sub.paymentCard ? `
        <div class="flex items-center justify-between py-3 gap-4">
          <div class="flex items-center gap-2.5 shrink-0"><span class="text-[#bbb]"><i data-lucide="credit-card" class="w-4 h-4"></i></span><span class="text-sm text-[#666]">Payment Card</span></div>
          <span class="text-sm font-semibold text-[#1a1a1a]">${sub.paymentCard}</span>
        </div>` : ''}
        <div class="flex items-center justify-between py-3 gap-4">
          <div class="flex items-center gap-2.5 shrink-0"><span class="text-[#bbb]"><i data-lucide="mail" class="w-4 h-4"></i></span><span class="text-sm text-[#666]">Account</span></div>
          <span class="text-sm font-semibold text-[#1a1a1a] truncate max-w-[180px]">${sub.account||'—'}</span>
        </div>
        <div class="border-t border-gray-100 my-0.5"></div>
        <div class="flex items-center justify-between py-3 gap-4">

// ─── RENDER ────────────────────────────────────────────────────────────────
function render() {
  document.getElementById('app').innerHTML = appHtml();
  lucide.createIcons();

  // restore search focus if needed
  if (document.activeElement?.id !== 'search-input') {
    const si = document.getElementById('search-input');
    if (si && searchQuery) si.setSelectionRange(si.value.length, si.value.length);
  }
}

function renderDrawer() {
  const drawer = document.getElementById('detail-drawer');
  const overlay = document.getElementById('drawer-overlay');
  if (selectedSub) {
    const sub = subscriptions.find(s => s.id === selectedSub.id) || selectedSub;
    document.getElementById('drawer-content').innerHTML = drawerHtml(sub);
    drawer.classList.remove('translate-x-full');
    drawer.classList.add('translate-x-0');
    overlay.classList.remove('opacity-0', 'pointer-events-none');
    overlay.classList.add('opacity-100');
    document.body.style.overflow = 'hidden';
    lucide.createIcons();
  } else {
    drawer.classList.add('translate-x-full');
    drawer.classList.remove('translate-x-0');
    overlay.classList.add('opacity-0', 'pointer-events-none');
    overlay.classList.remove('opacity-100');
    document.body.style.overflow = '';
  }
}

function renderModal() {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  if (showModal) {
    content.innerHTML = modalHtml();
    overlay.classList.remove('opacity-0', 'pointer-events-none');
    overlay.classList.add('opacity-100');
    document.body.style.overflow = 'hidden';
    lucide.createIcons();
  } else {
    overlay.classList.add('opacity-0', 'pointer-events-none');
    overlay.classList.remove('opacity-100');
    document.body.style.overflow = '';
  }
}

// ─── ACTIONS ───────────────────────────────────────────────────────────────
function handleSearch(val) {
  searchQuery = val;
  render();
}

function toggleFilters() {
  showFilters = !showFilters;
  pendingStatus = statusFilter;
  pendingSort = sortBy;
  render();
}

function setPendingStatus(val) { pendingStatus = val; }
function setPendingSort(val) { pendingSort = val; }

function applyFilters() {
  statusFilter = pendingStatus;
  sortBy = pendingSort;
  showFilters = false;
  render();
}

function clearFilters() {
  searchQuery = '';
  statusFilter = 'All Status';
  sortBy = 'Renewal Date';
  pendingStatus = 'All Status';
  pendingSort = 'Renewal Date';
  showFilters = false;
  render();
}

function openDrawer(id) {
  selectedSub = subscriptions.find(s => s.id === id);
  renderDrawer();
}

function closeDrawer() {
  selectedSub = null;
  renderDrawer();
}

function changeStatus(id, newStatus) {
  subscriptions = subscriptions.map(s => s.id === id ? {...s, status: newStatus} : s);
  selectedSub = subscriptions.find(s => s.id === id);
  renderDrawer();
  render();
}

function handleDelete(id) {
  if (confirm('Are you sure you want to delete this subscription?')) {
    subscriptions = subscriptions.filter(s => s.id !== id);
    selectedSub = null;
    renderDrawer();
    render();
  }
}

function handleEdit(id) {
  alert(`Edit subscription #${id} — connect your edit form here.`);
}

function openModal() {
  showModal = true;
  modalForm = { service:'', plan:'', cost:'', currency:'USD', billingCycle:'Monthly', renewal:'', account:'', paymentCard:'', category:'Other', status:'Active', brandColorIndex:0 };
  modalErrors = {};
  renderModal();
}

function closeModal() {
  showModal = false;
  renderModal();
}

function handleModalOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function setBillingCycle(cycle) {
  modalForm.billingCycle = cycle;
  syncModalFormFromDOM();
  document.getElementById('modal-content').innerHTML = modalHtml();
  lucide.createIcons();
}

function setBrandColor(i) {
  syncModalFormFromDOM();
  modalForm.brandColorIndex = i;
  document.getElementById('modal-content').innerHTML = modalHtml();
  lucide.createIcons();
}

function syncModalFormFromDOM() {
  const f = document.getElementById('add-form');
  if (!f) return;
  const fd = new FormData(f);
  modalForm.service = fd.get('service') || '';
  modalForm.plan = fd.get('plan') || '';
  modalForm.cost = fd.get('cost') || '';
  modalForm.currency = fd.get('currency') || 'USD';
  modalForm.renewal = fd.get('renewal') || '';
  modalForm.account = fd.get('account') || '';
  modalForm.paymentCard = fd.get('paymentCard') || '';
  modalForm.category = fd.get('category') || 'Other';
  modalForm.status = fd.get('status') || 'Active';
}

function handleAddSubmit(event) {
  event.preventDefault();
  const f = new FormData(event.target);
  const service = (f.get('service') || '').trim();
  const cost = f.get('cost') || '';
  const renewal = f.get('renewal') || '';
  const plan = (f.get('plan') || '').trim();
  const currency = f.get('currency') || 'USD';
  const billingCycle = modalForm.billingCycle;
  const account = (f.get('account') || '').trim();
  const paymentCard = (f.get('paymentCard') || '').trim();
  const category = f.get('category') || 'Other';
  const status = f.get('status') || 'Active';

  const errs = {};
  if (!service) errs.service = 'Service name is required';
  if (!cost || isNaN(Number(cost)) || Number(cost) <= 0) errs.cost = 'Enter a valid cost';
  if (!renewal) errs.renewal = 'Renewal date is required';

  if (Object.keys(errs).length > 0) {
    modalErrors = errs;
    modalForm = { service, plan, cost, currency, billingCycle, renewal, account, paymentCard, category, status, brandColorIndex: modalForm.brandColorIndex };
    document.getElementById('modal-content').innerHTML = modalHtml();
    lucide.createIcons();
    return;
  }

  const newSub = {
    id: Date.now(),
    service,
    plan: plan || null,
    iconUrl: '',
    iconLabel: service.slice(0,3).toUpperCase(),
    brandColor: BRAND_COLORS[modalForm.brandColorIndex],
    textOnCard: 'white',
    billingCycle,
    sharedMembers: [],
    account: account || null,
    cost: Number(cost),
    currency,
    isShared: false,
    renewal: new Date(renewal),
    status,
    category,
    paymentCard: paymentCard || null,
  };

  subscriptions = [newSub, ...subscriptions];
  closeModal();
  render();
}

function exportCSV() {
  const filtered = getFiltered();
  const headers = ['#','Service','Plan','Billing Cycle','Cost','Currency','My Portion','Shared','Shared With','Account','Payment Card','Renewal Date','Status','Category'];
  const rows = filtered.map((s,i) => [
    i+1, s.service, s.plan||'', s.billingCycle, s.cost, s.currency,
    s.isShared && s.myPortion != null ? s.myPortion : s.cost,
    s.isShared ? 'Yes' : 'No',
    s.sharedMembers.map(m=>m.name).join('; '),
    s.account||'', s.paymentCard||'',
    new Date(s.renewal).toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}),
    s.status, s.category
  ]);
  const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'subscriptions.csv'; a.click();
  URL.revokeObjectURL(url);
}

// ─── KEYBOARD ──────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (showModal) { closeModal(); }
    else if (selectedSub) { closeDrawer(); }
  }
});

// ─── INIT ──────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
