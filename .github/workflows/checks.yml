name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subscription_manager_backend
    env:
      SECRET_KEY: ci-test-key-unused-outside-tests
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: subscription_manager_backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: node --test legacy/tests_js/dashboard_js.test.cjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subscription_manager_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: subscription_manager_frontend/package-lock.json
      - run: npm ci
      - run: npm run build
