<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family:Arial,sans-serif;background:#f8fafc;padding:16px;">
    <div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;">
        <h2 style="margin:0 0 10px 0;color:#0f172a;">Team Invitation</h2>
        <p style="margin:0 0 12px 0;color:#334155;">
            You were invited to join <strong>{{ team.name }}</strong> on DUES as <strong>{{ invite.get_role_display }}</strong>.
        </p>
        <p style="margin:0 0 14px 0;">
            <a href="{{ invite_url }}" style="display:inline-block;background:#0f172a;color:#fff;text-decoration:none;padding:10px 14px;border-radius:8px;">Accept invitation</a>
        </p>
        <p style="margin:0 0 8px 0;color:#64748b;font-size:13px;">
            This secure single-use link expires on {{ expires_at|date:"F d, Y g:i A T" }}.
        </p>
        <p style="margin:0;color:#64748b;font-size:13px;">
            No credentials are sent in email for security.
        </p>
    </div>
</body>
</html>
