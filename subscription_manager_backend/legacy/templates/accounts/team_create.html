{% extends "base.html" %}

{% block title %}Create Team - DUES{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white border border-slate-200 rounded-2xl p-6">
    <h1 class="text-xl font-semibold text-slate-900">Create Team</h1>
    <p class="text-sm text-slate-600 mt-1">Create a team to share subscription access securely.</p>

    <form method="post" class="mt-4 space-y-3">
        {% csrf_token %}
        <div>
            <label for="id_name" class="block text-sm font-medium text-slate-700 mb-1">Team Name</label>
            <input id="id_name" name="name" type="text" required maxlength="120" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" value="{{ form.name.value|default:'' }}">
            {% if form.name.errors %}
            <p class="text-xs text-rose-600 mt-1">{{ form.name.errors.0 }}</p>
            {% endif %}
        </div>
        <button type="submit" class="px-3 py-2 rounded-lg bg-slate-900 text-white text-sm">Create Team</button>
    </form>
</div>
{% endblock %}
