{% extends "base.html" %}
{% load static %}

{% block title %}Payment Methods - DUES{% endblock %}

{% block extra_css %}
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{% static 'subscriptions/cards.css' %}?v=20260309-1" />
{% endblock %}

{% block content %}
<div class="cards-screen-wrap">
  <div id="cards-app"></div>
</div>

{{ cards_initial_state|json_script:"cards-initial-state" }}
<script>
  window.CARDS_API_URLS = {
    state: "{% url 'subscriptions:cards_api_state' %}",
    create: "{% url 'subscriptions:cards_api_create' %}",
    update: "{% url 'subscriptions:cards_api_update' 987654321 %}",
    setPrimary: "{% url 'subscriptions:cards_api_set_primary' 987654321 %}",
    remove: "{% url 'subscriptions:cards_api_delete' 987654321 %}"
  };
</script>
{% endblock %}

{% block extra_js %}
<script src="{% static 'subscriptions/cards.js' %}"></script>
{% endblock %}
