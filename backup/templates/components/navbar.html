<nav class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a href="/" class="flex-shrink-0 flex items-center">
                    <span class="text-2xl font-bold text-indigo-600">Subly</span>
                </a>
                <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                    {% if user.is_authenticated %}
                    <a href="{% url 'dashboard:home' %}"
                        class="border-indigo-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Dashboard</a>
                    <a href="{% url 'subscriptions:list' %}"
                        class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Subscriptions</a>
                    {% endif %}
                </div>
            </div>
            <div class="flex items-center">
                {% if user.is_authenticated %}
                <span class="text-sm text-gray-500 mr-4">{{ user.email }}</span>
                <form action="{% url 'accounts:logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit"
                        class="bg-white text-gray-700 px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 transition text-sm font-medium">Logout</button>
                </form>
                {% else %}
                <a href="{% url 'accounts:login' %}"
                    class="text-gray-500 hover:text-gray-700 px-3 py-2 text-sm font-medium">Login</a>
                <a href="{% url 'accounts:signup' %}"
                    class="ml-4 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition text-sm font-medium shadow-sm">Sign
                    Up</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
